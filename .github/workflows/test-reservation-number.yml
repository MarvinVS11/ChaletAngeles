name: test-reservation-number
on: workflow_dispatch

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Crear reserva de prueba y reportar
        run: |
          RESULT=$(curl -s -L -X POST https://chalet-angeles-server.vercel.app/api/reservations \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Prueba Numero Reserva",
              "email": "marvix91@gmail.com",
              "phone": "00000000",
              "checkIn": "2027-03-01",
              "checkOut": "2027-03-02",
              "guests": 1,
              "origin": "Prueba tecnica",
              "breakfast": false,
              "message": "Reserva de prueba del sistema de numeros. Puede cancelarse."
            }')
          echo "$RESULT"
          NUM=$(echo "$RESULT" | grep -o '"reservationNumber":"[^"]*"' || echo 'sin numero')
          BODY=$(echo "POST resultado: $NUM ||| respuesta: $RESULT" | head -c 1500 | sed 's/"/\\"/g')
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\":\"Resultado creacion reserva de prueba\",\"body\":\"$BODY\"}"

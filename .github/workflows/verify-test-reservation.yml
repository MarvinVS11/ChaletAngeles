name: verify-test-reservation
on: workflow_dispatch

permissions:
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar disponibilidad de las fechas de prueba
        run: |
          RESULT=$(curl -s "https://chalet-angeles-server-git-main-marvinvs.vercel.app/api/reservations/availability?checkIn=2027-03-01&checkOut=2027-03-02")
          echo "availability: $RESULT"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\":\"Resultado prueba numero de reserva\",\"body\":\"availability 2027-03-01 a 2027-03-02: ${RESULT//\"/\\\"}\"}"

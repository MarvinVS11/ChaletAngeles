name: test-horarios
on: workflow_dispatch

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Crear reserva de prueba y reportar
        run: |
          RESULT=$(curl -s -L -X POST https://chalet-angeles-server.vercel.app/api/reservations \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Prueba Horarios",
              "email": "marvi11@hotmail.es",
              "phone": "00000000",
              "checkIn": "2027-03-05",
              "checkOut": "2027-03-06",
              "guests": 1,
              "origin": "Prueba tecnica",
              "breakfast": false,
              "message": "Prueba de horarios de entrada y salida en el correo. Puede cancelarse."
            }')
          NUM=$(echo "$RESULT" | grep -o '"reservationNumber":"[^"]*"' || echo 'sin numero')
          BODY=$(echo "POST resultado: $NUM ||| respuesta: $RESULT" | head -c 1200 | sed 's/"/\\"/g')
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\":\"Resultado prueba horarios\",\"body\":\"$BODY\"}"
